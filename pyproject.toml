[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finger-physics"
version = "0.2.0"
description = "Real-time camera finger-joint tracking with a physics-simulated hand skeleton and latency prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mediapipe>=0.10.14",
  "opencv-contrib-python>=4.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finger-physics = "finger_physics.__main__:main"

[tool.setuptools.packages.find]
include = ["finger_physics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
